<!doctype html>
<!-- concept: The scoreboard stays a scoreboard. Findings are collected in their own band
     below it, one open card per category, with the section tables, charts and maps shown
     full width where they finally have room. Each category in the accordion carries a
     small "Findings ↓" jump. Reads as: here are the scores, and here is what we concluded. -->
<!-- replaces: city.html -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept B — Findings band · Region</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="findings-concept.css" />
<style>
/* Concept-level only. */

.fcJump {
  float: right;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--blue);
  text-decoration: none;
  text-transform: uppercase;
}
.fcJump:hover { text-decoration: underline; }

.fcBand { background: var(--wash); }

.fcCards { display: grid; gap: 22px; }

.fcCard {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rl);
  padding: 26px 28px 28px;
  scroll-margin-top: 90px;
}

.fcCardHead { margin-bottom: 18px; }

.fcCardCat {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 6px;
}

.fcCardHead h3 {
  margin: 0 0 6px;
  font-size: 20px;
  line-height: 1.25;
  letter-spacing: -.01em;
}

/* Figures get the full card width here — the reason this direction exists. */
.fcCard .fcFig { max-width: none; }
.fcCard .fcImg { max-width: 780px; }

@media (max-width: 620px) {
  .fcCard { padding: 20px 18px 22px; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div id="napCrumbs"></div>
    <div id="fcHost"></div>
  </div>

  <script src="../regions.js"></script>
  <script src="../data.js"></script>
  <script src="../scores.js"></script>
  <script src="../learn-data.js"></script>
  <script src="../nap.js"></script>
  <script src="findings-concept-data.js"></script>
  <script src="findings-concept-render.js"></script>
  <script>
    NAP.shell({ page: "region", crumbs: [["Overview", "../index.html"], "Concept B — findings band"] });
    window.FC_MODE = "band";
  </script>
  <script src="findings-concept-page.js"></script>
</body>
</html>
